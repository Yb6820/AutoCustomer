version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MYSQL_DATABASE: autocustomer
      MYSQL_USER: autocustomer
      MYSQL_PASSWORD: autocustomer
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MINIO_ENDPOINT: minio:9000
    env_file:
      - .env.example
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - .:/app

  worker:
    build: .
    command: celery -A app.workers.celery_app worker -l info -Q default,embedding,index
    environment:
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379/0
      REDIS_CELERY_BROKER: redis://redis:6379/1
      REDIS_CELERY_BACKEND: redis://redis:6379/2
      MILVUS_HOST: milvus
    env_file:
      - .env.example
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - .:/app

  beat:
    build: .
    command: celery -A app.workers.celery_app beat -l info
    environment:
      REDIS_CELERY_BROKER: redis://redis:6379/1
      REDIS_CELERY_BACKEND: redis://redis:6379/2
    env_file:
      - .env.example
    depends_on:
      - redis
    volumes:
      - .:/app

volumes:
  mysql_data:
  etcd_data:
  minio_data: